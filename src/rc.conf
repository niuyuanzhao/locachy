# /etc/locachy/rc.conf: LOCachy configuration
hibernate_after="30"
# Git repository checked by locachy-pkg for LOCachy source and container recipe updates ("off" disables)
update_repo="https://github.com/niuyuanzhao/locachy.git"
# Its branch to follow (default main): update_branch="NAME"

# Core services (optional modules add service_clipboard, service_audio, service_bluetooth, etc.)
service_session_bus="/usr/local/lib/locachy/bus-client session"
service_system_bus="/usr/local/lib/locachy/bus-client system"
service_udev="/usr/local/lib/locachy/udev-client"
# The debug cable link: a root shell, unauthenticated, for the computer at the
# other end of the cable (debug_link_interface); off until settings' Debug
# Cable row (locachy-setup debug-link on) turns it on
# service_link="/usr/local/lib/locachy/link-client fe80::14f0:c576:56c1:631f 2300"
service_network="/usr/local/lib/locachy/network-client"
service_drives="/usr/local/lib/locachy/drives"
# Network time and the time zone from the network (settings: Network time,
# and Time zone "Automatic"; choosing a zone there removes service_timezone)
service_ntp="/usr/local/lib/locachy/ntp-client"
service_timezone="/usr/local/lib/locachy/timezone-client"
# wallpaper="/home/USER/Pictures/NAME.jpg": the shared display's (settings, or w in files)
# service_clipboard: added when the shared Wayland display (desktop) is installed
# service_audio and program_mixer: added when Audio (PipeWire) is installed
# service_bluetooth and program_bluetooth: added when Bluetooth is installed
# service_tailscale: added and removed by settings' Tailscale switch
# service_clash and clash_mode ("tun" or "proxy"): settings' Clash switch
# service_tor and tor_front ("mihomo" or "bridges"): settings' Tor switch.
# Full-system Tor (tor-client): everything on the network goes through Tor
# (its firewall, tor-enforce), and Tor only through its front: Clash, or the
# bridge lines settings keeps in /var/lib/locachy/tor/bridges; never direct
# service_rclone: settings' Cloud drives switch (mounts remotes in ~/Drives)
debug_link_interface="eth0"

# Hardware preferences (a machine's own values are in its profile, machines/)
trackpoint_press_to_select="0"
pointer_accel="0.4"
# touchpad_circular: touchpads scroll as a finger goes round their edge
# (libinput's circular scrolling): "1" every touchpad, "0" none; unset,
# the round ones libinput knows (Panasonic's CF-SV1, CF-SV8, CF-FV1).
# Two-finger scrolling remains available. Settings also exposes
# touchpad_circular_width (unitless coordinate-range parameter, default 25)
# and touchpad_circular_dwell (milliseconds, default 300), passed through
# libinput's local quirks. The range is not a calibrated physical distance.
# internal_screen="DP-3": the computer's own screen when it is not on an eDP,
# LVDS or DSI connector (a panel fitted on another one); it comes first, and
# touch screens and pens are on it

# Optional Chinese input mode
ime_chinese="1"

# Configurable global hotkeys
key_home="Super+Esc Ctrl+Alt+Esc Ctrl+Alt+Super ThinkVantage"
# The lock screen (lock): also when the lid closes, at boot unless
# login_skip="1", and after lock_after="MINUTES" without input (10 unless
# set; 0: never; settings: Lock when idle)
key_lock="Super+L"
key_ime="Ctrl+Space"
# The input method's keys on a JIS keyboard, by keysym name (keyboards
# without them bind nothing): Henkan_Mode (right of the space bar) Chinese,
# Muhenkan (left of it) direct input, Zenkaku_Hankaku (left of 1, with the
# jp106 keymap) the width of Chinese mode's punctuation (as Shift+Space).
# Keys type as rc.conf's keymap has them, everywhere: keytable writes its
# table. settings: Keyboard
key_ime_cn="Henkan_Mode"
key_ime_raw="Muhenkan"
key_ime_width="Zenkaku_Hankaku"
# Keys that switch the width of the punctuation in Chinese mode only, read
# by each program as it reads keys (not bound in labwc, which would take
# them from every application)
key_ime_width_cn="Ctrl+. Shift+Space"
key_volume_up="VolumeUp"
key_volume_down="VolumeDown"
key_volume_mute="Mute"
key_mic_mute="MicMute"
key_brightness_up="BrightnessUp"
key_brightness_down="BrightnessDown"
# machine="NAME": hardware profile from /usr/local/share/locachy/machines (none: generic PC)
# The shared display's: a window of foot, the terminal (settings changes it)
key_terminal="Ctrl+Alt+T"

# Programs (Enter: open/resume, k: close/kill, ThinkVantage / Super+Esc: home)
# term: the user's shell (sudo for root), on the network unless
# term_network="0"; admin: root's shell, without the network
program_term="/usr/local/bin/term /usr/local/lib/locachy/user-shell"
program_admin="/usr/local/bin/term"
program_network="/usr/local/bin/term /usr/bin/nmtui"
program_settings="/usr/local/bin/settings"
program_packages="/usr/local/bin/packages"
program_firmware="/usr/local/bin/firmware"
