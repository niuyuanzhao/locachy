# Hardware profile: HP OMEN 17-ck1xxx (board 8A1A, i9-12900HX + RTX 3080 Ti Laptop)
# Brand: HP
description="HP OMEN 17-ck1xxx (board 8A1A)"
display_card="xe"
extdisplay_card="xe"
boot_cmdline="nouveau.modeset=0 nvidia_drm.modeset=1 i915.force_probe=!4688 xe.force_probe=4688"
# dGPU power through the HP BIOS WMI modes (machines/hp-omen-gpu, hp_omen_gpu):
# "full" is cTGP 150 W with Dynamic Boost to 175 W and D-state 100%.
gpu_power_method="hp-omen-wmi"
gpu_power_mode="full"
nvidia_powerd="1"
