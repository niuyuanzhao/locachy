# The live installer is generic x86-64 throughout: never inherit optimized
# repositories from the machine building the ISO. Target roots choose theirs.
[options]
Architecture = x86_64
HoldPkg = pacman glibc
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
