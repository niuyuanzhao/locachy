# LOCachy preset: QQ (AUR linuxqq, Electron), on the network. On Wayland only
# with --ozone-platform=wayland: there is no X server. Chosen, it is copied to
# /etc/locachy/containers/qq.conf and is the user's from then on.
package="linuxqq"
extras="libnotify"
command="/usr/bin/linuxqq"
arguments="--ozone-platform=wayland"
network="1"
camera="1"
directories=""
