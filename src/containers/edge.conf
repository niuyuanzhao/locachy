# LOCachy preset: Microsoft Edge (AUR microsoft-edge-stable-bin), on the
# network, with --ozone-platform=wayland: there is no X server. Chosen, it is
# copied to /etc/locachy/containers/edge.conf and is the user's from then on.
package="microsoft-edge-stable-bin"
extras=""
command="/usr/bin/microsoft-edge-stable"
arguments="--ozone-platform=wayland"
network="1"
camera="1"
directories=""
