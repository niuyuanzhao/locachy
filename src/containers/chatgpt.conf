# ChatGPT with OpenAI's Codex agent: a host program, so the agent and its
# terminal work on the real system as the user (the host's root, home, tools
# and shell) and on the network; root only through sudo, as in foot. The
# AUR's chatgpt-desktop (OpenAI's Linux .deb, its checksum pinned), on
# Chromium: --ozone-platform=wayland, as for Code. Closing its window leaves
# it in its tray; stopping it in home ends it.
host="1"
package="chatgpt-desktop"
command="/usr/bin/chatgpt"
arguments="--ozone-platform=wayland"
network="1"
desktop="chatgpt.desktop"
