# Code - OSS: the editor of the shared display, a host program. It draws at the
# screen's fractional scale itself with --ozone-platform=wayland (Electron 42
# ignores ELECTRON_OZONE_PLATFORM_HINT); no keyring: the basic password store.
host="1"
package="code"
command="/usr/local/lib/locachy/code-oss"
arguments="--ozone-platform=wayland --password-store=basic"
network="1"
desktop="code-oss.desktop"
