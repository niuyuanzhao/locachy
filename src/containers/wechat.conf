# LOCachy preset: WeChat (AUR wechat-bin, Qt: on Wayland by itself), on the
# network. Its package does not name every library it needs: at-spi2-core
# (atk, atk-bridge, atspi) and libcups are added. Chosen, it is copied to
# /etc/locachy/containers/wechat.conf and is the user's from then on.
package="wechat-bin"
extras="at-spi2-core libcups"
command="/opt/wechat/wechat"
arguments=""
network="1"
camera="1"
directories=""
