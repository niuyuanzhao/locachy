# Installed by LOCachy make.sh.
#
# foot sets TERM=foot (or foot-direct / foot-extra). A remote host without
# foot's terminfo entry (macOS has none; checked with infocmp) cannot find the
# control sequences for TERM=foot, so its shell and line editor draw garbage.
#
# OpenSSH 8.7+ honors SetEnv TERM in the SSH2 pty-req message, independent of
# the remote sshd's AcceptEnv list. Any user entry in ~/.ssh/config is read
# before /etc/ssh/ssh_config.d/* and therefore wins via first-match precedence,
# so a host known to carry foot's terminfo can still opt in with:
#
#   Host my-arch-box
#       SetEnv TERM=foot
Match exec "case \"$TERM\" in foot|foot-*) exit 0;; *) exit 1;; esac"
    SetEnv TERM=xterm-256color
