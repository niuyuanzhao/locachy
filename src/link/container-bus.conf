<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- /usr/local/share/locachy/container-bus.conf: the private session bus of
     one container. locachy-app starts it in the container, as the user; no
     bus of the host is there. locachy-bar connects as root, from the host,
     to be the tray's StatusNotifierWatcher. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:path=/run/locachy-bus/bus</listen>
  <auth>EXTERNAL</auth>
  <standard_session_servicedirs/>
  <policy context="default">
    <allow user="root"/>
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
