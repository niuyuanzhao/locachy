<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- /usr/local/share/locachy/docs-bus.conf: the documents bus of the host
     (locachy-docs, tools/DOCUMENTS.md). The service runs it as the user;
     only the user connects (the bus default), and no container has its
     directory: any peer here may add, grant and delete every document. The
     packaged xdg-document-portal and xdg-permission-store start on it by
     their own service files. -->
<busconfig>
  <type>session</type>
  <listen>unix:path=/run/locachy/docs/user/bus</listen>
  <auth>EXTERNAL</auth>
  <standard_session_servicedirs/>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
