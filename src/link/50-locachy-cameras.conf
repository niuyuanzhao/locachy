# The cameras are not PipeWire's (/etc/wireplumber/wireplumber.conf.d,
# make.sh). A container has a camera only through device nodes of its own
# (locachy-app, camera="1"), never the face unlock one; through the shared
# PipeWire every container would have every camera. So WirePlumber does not
# load its video capture monitors (hardware.video-capture: monitor.v4l2,
# monitor.libcamera; wireplumber.conf), here for main and so for
# main-systemwide, which inherits it. Nor is its user in the video group
# (audio-client), so PipeWire cannot open /dev/video* or /dev/media* anyway.
wireplumber.profiles = {
  main = {
    hardware.video-capture = disabled
  }
}
