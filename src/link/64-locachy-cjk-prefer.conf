<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  /etc/fonts/conf.d/64-locachy-cjk-prefer.conf (make.sh): which variant of
  the CJK fonts module's Noto CJK families text in Han characters gets when
  nothing says its language: Simplified Chinese first, as the Arch Wiki's
  Localization/Simplified_Chinese has it. Arch's noto-fonts-cjk ships no
  fontconfig file, and fontconfig's own 65-nonlatin.conf names only the
  Korean variant, so without this Chinese shows Korean glyph forms in every
  locale (tools/FONTS.md). Before 65-nonlatin.conf, weakly bound as any
  <alias> is: the user's own fonts.conf (50-user.conf) still comes first.
  Families that are not installed change nothing.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK JP</family>
    </prefer>
  </alias>
</fontconfig>
