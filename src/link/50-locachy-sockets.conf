# PipeWire's sockets and the access each gives (/etc/pipewire/pipewire.conf.d,
# make.sh). audio-client runs the daemon as the system user pipewire with
# PIPEWIRE_RUNTIME_DIR=/run/pipewire, as PipeWire's system-wide units do
# (src/daemon/systemd/system/pipewire.service.in).
#
# pipewire-0 and pipewire-0-manager are those units' sockets with their modes
# (pipewire.socket: SocketMode=0660, pipewire-manager.socket: 0600) and the
# access libpipewire-module-access documents for them (module-access.c,
# access.socket: pipewire-0 "default", pipewire-0-manager "unrestricted"):
# WirePlumber and wpctl use the manager socket, pipewire-pulse and root's
# programs pipewire-0. No container reaches either.
#
# restricted/pipewire-0 is the containers' (locachy-app links it as their
# pipewire-0): "restricted", to which WirePlumber gives read and execute only
# (50-locachy-access.conf). Their programs run as the user with no
# supplementary group (app-init), so the socket is open to all (a pipewire
# group 0660 would refuse them) and the gate is the directory around it:
# /run/pipewire is 0700, the servers' (audio-client), as a session's runtime
# directory is the gate of its sockets; a container has a bind mount of
# /run/pipewire/restricted only, the directory of its socket, so that the
# socket a restarted PipeWire makes reaches it too. A name with a slash is a
# path under the runtime directory (module-protocol-native.c
# init_socket_name); module-access matches the name as written here.
module.protocol-native.args = {
    sockets = [
        { name = "pipewire-0" mode = "0660" }
        { name = "pipewire-0-manager" mode = "0600" }
        { name = "restricted/pipewire-0" mode = "0666" }
    ]
}

module.access.args = {
    access.socket = {
        pipewire-0 = "default"
        pipewire-0-manager = "unrestricted"
        "restricted/pipewire-0" = "restricted"
    }
}
