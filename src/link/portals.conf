# LOCachy (/etc/xdg/xdg-desktop-portal/portals.conf, with the desktop module):
# the containers' programs share a screen and take screenshots through
# xdg-desktop-portal-wlr, which locachy-app starts on each container's bus,
# on the shared display; they choose files to open and places to save in
# xdg-desktop-portal-gtk's dialog, which the container's own bus starts in
# the container (its files, as the user, on locachy-0), as sway pairs them;
# no other portal backend is asked.
[preferred]
default=none
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
