# LOCachy (/etc/xdg/xdg-desktop-portal/portals.conf, with the desktop module):
# containers that may share a screen do so through xdg-desktop-portal-wlr,
# which locachy-app starts on their bus, on the shared display (slurp asks
# which screen; silent Screenshot capture is not offered); they choose files
# to open and places to save in xdg-desktop-portal-gtk's dialog, which the
# container's own bus starts in the container (its files, as the user, on
# locachy-0), as sway pairs them; no other portal backend is asked.
[preferred]
default=none
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
