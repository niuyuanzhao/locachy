# LOCachy container portal preferences. Keep Settings exclusive: the portal
# front end forwards live changes from every configured Settings backend,
# including conflicting color-scheme values from gtk. Screen and file backends
# remain unchanged.
[preferred]
default=none
org.freedesktop.impl.portal.Settings=locachy
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
