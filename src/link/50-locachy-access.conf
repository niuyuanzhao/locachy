# What a restricted PipeWire client may do (/etc/wireplumber/wireplumber.conf.d,
# make.sh): the containers' clients, native (pipewire-0-restricted,
# 50-locachy-sockets.conf) and Pulse (50-locachy-pulse.conf).
#
# Read and execute, as WirePlumber's own default for "restricted" means it
# (scripts/client/find-default-access.lua: Perm.RX): see the objects, play,
# record, but not change a device, another stream or the defaults (no w) and
# set no metadata (no m). In WirePlumber 0.5.18 that constant is wrong: Lua
# has no octal numbers, so Perm.RX (0400 | 0100, read as decimal) is r, w, x
# and l (modules/module-lua-scripting/api/api.lua; WirePlumber's master has
# hexadecimal values). A permission string is parsed in C instead
# (lib/wp/permission-manager.c), so the rule below gives exactly r-x
# (docs/rst/daemon/configuration/access.rst: access.rules, default_permissions).
access.rules = [
  {
    matches = [ { access = "restricted" } ]
    actions = { update-props = { default_permissions = "rx" } }
  }
]
