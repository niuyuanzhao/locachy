# pipewire-pulse for the containers (/etc/pipewire/pipewire-pulse.conf.d,
# make.sh): its socket is /run/pulse/restricted/native (PULSE_RUNTIME_PATH
# /run/pulse, as pipewire-pulse.service.in sets it; a relative unix: address
# is under it, module-protocol-pulse/server.c parse_unix_address), whose
# directory locachy-app binds into them (their pulse/native links to it), so
# that the socket a restarted pipewire-pulse makes reaches them too; no host
# program uses it.
#
# Its clients are restricted: the address's client.access becomes each
# client's pipewire.client.access (module-protocol-pulse/server.c), which
# WirePlumber applies (scripts/lib/common-utils.lua get_client_access;
# 50-locachy-access.conf). They may not load or unload modules: do_load_module
# and do_unload_module refuse with EACCES unless pulse.allow-module-loading
# (module-protocol-pulse/pulse-server.c). The modules of pulse.cmd, loaded by
# pipewire-pulse itself when it starts (cmd.c), are not affected.
pulse.properties = {
    server.address = [
        { address = "unix:restricted/native" client.access = "restricted" }
    ]
    pulse.allow-module-loading = false
}
