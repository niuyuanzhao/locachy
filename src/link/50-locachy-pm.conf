# /usr/local/lib/modprobe.d/50-locachy-pm.conf: LOCachy laptop power-management
# module defaults. Override or disable in /etc/modprobe.d/50-locachy-pm.conf.
# HDA codec powers down after 1 s of silence. If a codec pops when it wakes,
# set power_save=0 in the override file. Wi-Fi power saving is NetworkManager's
# (wifi.powersave in /etc/NetworkManager/conf.d), not a second driver knob.
options snd_hda_intel power_save=1 power_save_controller=Y
