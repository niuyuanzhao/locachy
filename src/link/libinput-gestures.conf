# /etc/locachy/libinput-gestures.conf (make.sh): the touchpad's gestures on
# the shared display (/usr/local/lib/locachy/gestures runs libinput-gestures
# with it). Three fingers as in the direct programs (swipe() in
# base/pointer.c): up goes home, left and right to the next and previous
# task, asked of process 1 through labwc-control, as labwc's home key is.
# Four: KWin's overview, up to show it, down to close it. Two fingers scroll
# in the application: nothing here.
gesture swipe up 3 /usr/local/lib/locachy/labwc-control --action home
gesture swipe left 3 /usr/local/lib/locachy/labwc-control --action next
gesture swipe right 3 /usr/local/lib/locachy/labwc-control --action prev
gesture swipe up 4 /usr/local/bin/locachy-overview --show
gesture swipe down 4 /usr/local/bin/locachy-overview --hide
# As there, a swipe counts from SWIPE_UNITS of libinput's unaccelerated
# motion, however long it takes.
swipe_threshold 100
timeout 0
