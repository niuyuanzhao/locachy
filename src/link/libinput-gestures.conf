# /etc/locachy/libinput-gestures.conf (make.sh): the touchpad's gestures on
# the shared display (/usr/local/lib/locachy/gestures runs libinput-gestures
# with it): KWin's overview, four fingers up to show it, down to close it.
gesture swipe up 4 /usr/local/bin/locachy-overview --show
gesture swipe down 4 /usr/local/bin/locachy-overview --hide
