# /usr/local/lib/sysctl.d/50-locachy.conf: kernel hardening defaults
# (systemd's 50-default.conf and Arch's 10-arch.conf, applied at boot by
# process 1 through systemd-sysctl).
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 2
fs.suid_dumpable = 0
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
-kernel.yama.ptrace_scope = 1
-kernel.unprivileged_bpf_disabled = 1
kernel.sysrq = 0
