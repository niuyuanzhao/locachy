# /usr/local/lib/sysctl.d/50-locachy.conf: kernel hardening defaults
# (systemd's 50-default.conf and Arch's 10-arch.conf, applied at boot by
# process 1 through systemd-sysctl).
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 2
fs.suid_dumpable = 0
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
-kernel.yama.ptrace_scope = 1
-kernel.unprivileged_bpf_disabled = 1
kernel.sysrq = 0

# Fewer disk wakeups (writeback every 15 s instead of 5 s) and no swap
# readahead, which only costs time on zram. The NMI watchdog stays on: it is
# what reports hard lockups.
vm.dirty_writeback_centisecs = 1500
vm.page-cluster = 0
