[main]
dhcp=internal
plugins=keyfile
# Through openresolv, as Tailscale does (its openresolv mode): both end up
# in the namespace's resolv.conf, MagicDNS first.
rc-manager=resolvconf

[device]
match-device=*
managed=1

# Prefer wired connections while keeping Wi-Fi available as a fallback.
[connection-wired]
match-device=type:ethernet
ipv4.route-metric=100
ipv6.route-metric=100

[connection-wireless]
match-device=type:wifi
ipv4.route-metric=600
ipv6.route-metric=600

# Privacy, on every network that does not say otherwise (settings chooses per
# network): a random MAC address of its own, the same each time on that
# network ("random": a new one each time it connects; "permanent": the card's
# real one, for a network that knows the machine by it), keeping the card's
# vendor part (OUI) as Tails does, so that it looks like any card of that
# make; no host name sent by DHCP; IPv6 temporary addresses for outgoing
# connections.
[connection]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
wifi.generate-mac-address-mask=FF:FF:FF:00:00:00
ethernet.generate-mac-address-mask=FF:FF:FF:00:00:00
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ipv6.ip6-privacy=2
