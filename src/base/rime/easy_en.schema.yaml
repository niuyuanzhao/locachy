schema:
  schema_id: easy_en
  name: "English"
  version: "0.2"

# English mode's front end (base/ime.c, en_key) gives Rime the letters and
# BackSpace only, as fcitx5's keyboard engine keeps its word: every other key
# commits the letters as typed and is typed itself, and Tab moves to a
# completion. So no key here selects or pages: none of the keys typed in
# English (Space, digits, - = [ ]) is taken from the text.
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcbaABCDEFGHIJKLMNOPQRSTUVWXYZ"
  auto_select: false

# Completions are offered; one is committed only when Tab moved to it.
translator:
  dictionary: easy_en
  enable_sentence: false
  enable_completion: true
  initial_quality: 1000

menu:
  page_size: 20
